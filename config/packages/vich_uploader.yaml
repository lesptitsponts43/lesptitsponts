vich_uploader:
  db_driver: orm
  mappings:
    valeurs_image:
      uri_prefix: /uploads/valeurs
      upload_destination: '%kernel.project_dir%/public/uploads/valeurs'
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
    galerie_image:
      uri_prefix: /uploads/galerie
      upload_destination: '%kernel.project_dir%/public/uploads/galerie'
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
    actualite_image:
      uri_prefix: /uploads/actualite
      upload_destination: '%kernel.project_dir%/public/uploads/actualite'
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
    partner_image:
      uri_prefix: /uploads/partenaire
      upload_destination: '%kernel.project_dir%/public/uploads/partenaire'
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer